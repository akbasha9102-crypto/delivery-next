<svg viewBox="0 0 100 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shoulders / jacket -->
  <path d="M10 115 Q10 95 50 95 Q90 95 90 115Z" fill="#f97316"/>
  <rect x="30" y="88" width="40" height="14" rx="6" fill="#f97316"/>
  <!-- Helmet main body (full coverage) -->
  <circle cx="50" cy="50" r="38" fill="#ef4444"/>
  <!-- Helmet chin/lower part -->
  <path d="M16 58 Q12 80 28 90 Q38 96 50 96 Q62 96 72 90 Q88 80 84 58Z" fill="#dc2626"/>
  <!-- Visor slot (dark opening) -->
  <rect x="20" y="50" width="60" height="20" rx="7" fill="#0f172a"/>
  <!-- Eyes (visible through visor) -->
  <circle cx="36" cy="60" r="7.5" fill="white"/>
  <circle cx="64" cy="60" r="7.5" fill="white"/>
  <circle cx="37" cy="61" r="4.5" fill="#0f172a"/>
  <circle cx="65" cy="61" r="4.5" fill="#0f172a"/>
  <circle cx="39" cy="59" r="1.8" fill="white"/>
  <circle cx="67" cy="59" r="1.8" fill="white"/>
  <!-- Visor glare -->
  <path d="M23 52 Q30 50 38 52" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
  <!-- Helmet top gloss -->
  <ellipse cx="36" cy="24" rx="14" ry="8" fill="white" opacity="0.12" transform="rotate(-18 36 24)"/>
  <!-- Chin strap -->
  <path d="M24 80 Q50 92 76 80" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Helmet side vents -->
  <path d="M13 50 L19 47" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 56 L19 54" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <path d="M87 50 L81 47" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <path d="M87 56 L81 54" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <!-- Top helmet fin/ridge -->
  <path d="M36 12 Q50 8 64 12 Q56 14 50 13 Q44 14 36 12Z" fill="#b91c1c"/>
</svg>
